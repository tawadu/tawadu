[workspace]
resolver = "2"
members = ["crates/tawadu-core", "crates/tawadu-audio", "crates/tawadu-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/tawadu/tawadu"
authors = ["Tawadu Contributors"]
readme = "README.md"

[workspace.dependencies]
# --- time & prayer math ---
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
hijridate = "0.1"
adhan = "0.2"
# --- storage ---
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# --- audio ---
rodio = "0.23"
symphonia = { version = "0.5", features = ["all"] }
hound = "3"
rubato = "0.15"
# --- async ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
# --- ui ---
# Pinned per ADR 0002: the KeepAlive adapter uses slint::private_unstable_api,
# which is public but marked unstable — a minor bump could move it.
slint = "=1.19.0"
# --- desktop integration ---
notify-rust = "4"
# tray-icon + own muda dep (ADR 0002). tray-icon 0.26 uses muda ^0.21, so both
# share one muda copy. Do NOT enable the winit backend's dormant muda feature.
# ksni = pure-Rust StatusNotifier tray on Linux (no GTK/appindicator system deps).
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
muda = "0.21"
single-instance = "0.3"
# --- misc ---
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
