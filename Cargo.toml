[workspace]
resolver = "2"
members = ["crates/tawadu-core", "crates/tawadu-audio", "crates/tawadu-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/tawadu/tawadu"
authors = ["Tawadu Contributors"]
readme = "README.md"

[workspace.dependencies]
# --- time & prayer math ---
jiff = "0.2"
salah = "0.7"
# --- storage ---
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# --- audio ---
rodio = "0.23"
symphonia = { version = "0.5", features = ["all"] }
hound = "3"
rubato = "0.15"
# --- async ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
# --- ui ---
slint = "1"
# --- desktop integration (added when wiring the app) ---
# tray-icon, notify-rust, auto-launch, single-instance, rfd, global-hotkey
# --- misc ---
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
