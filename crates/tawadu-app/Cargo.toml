[package]
name = "tawadu-app"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
tawadu-core = { path = "../tawadu-core" }
tawadu-audio = { path = "../tawadu-audio" }
chrono.workspace = true
chrono-tz.workspace = true
serde_json.workspace = true
serde.workspace = true
slint.workspace = true
log.workspace = true
env_logger.workspace = true
clap.workspace = true
notify-rust.workspace = true
single-instance.workspace = true
tray-icon.workspace = true
muda.workspace = true
auto-launch = "0.6.0"

[build-dependencies]
slint-build = "=1.19.0"

# Windows: AUMID registration for toasts (ADR 0002 condition 3) and the
# second-launch restore event. winapi stays internal to single-instance.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# Linux: probe for a StatusNotifier watcher before creating the tray (ADR 0002
# condition 4 — ksni's spawn assumes a watcher, so we check ourselves).
# Uses zbus 5.x, the same major ksni pulls. notify-rust independently pulls
# zbus 6.x for its XDG backend — two majors in the lock, one per consumer;
# they cannot unify.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
