name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-trigger (workflow_dispatch): covers dropped pull_request events
  # (e.g. branch push and PR creation racing within seconds — seen on PR #2,
  # 2026-11-19: 18+ min without a run) and lets Atlas re-run CI on any ref.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxdo-dev xvfb

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets

      # The tray lifecycle regression test launches the real GUI binary, so
      # Linux needs a display. Under xvfb there is no SNI watcher, which
      # exercises the KeepWindowShown fallback path (ADR 0002 condition 4);
      # the hide-to-tray path is exercised on Windows/macOS runners.
      - name: Test (Linux, virtual display)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a cargo test --workspace

      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
