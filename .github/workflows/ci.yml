name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-trigger (workflow_dispatch): covers dropped pull_request events
  # (e.g. branch push and PR creation racing within seconds — seen on PR #2,
  # 2026-11-19: 18+ min without a run) and lets Atlas re-run CI on any ref.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxdo-dev xvfb

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets

      # The tray lifecycle regression test launches the real GUI binary, so
      # Linux needs a display; the stub SNI watcher below gives it the SAME
      # real hide-to-tray coverage as Windows/macOS. The suite still branches
      # on tray availability, so a watcher failure degrades to an honest
      # KeepWindowShown fallback test instead of a spurious red.
      - name: Test (Linux, virtual display + stub SNI watcher)
        if: matrix.os == 'ubuntu-latest'
        # Real hide-path coverage without external tray packages: a minimal
        # python3-dbus StatusNotifierWatcher (scripts/ci/sni_watcher.py) owns
        # the well-known name and accepts registrations — all the zbus probe
        # and ksni need. snixembed is Debian-only (absent on noble, run
        # 44440795375). dbus-run-session gives a deterministic private bus.
        # --nocapture surfaces the test's tray-path confirmation in the log.
        run: |
          sudo apt-get install -y -qq python3-dbus dbus
          dbus-run-session -- xvfb-run -a bash -c 'python3 scripts/ci/sni_watcher.py & sleep 2; cargo test --workspace -- --nocapture'

      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
